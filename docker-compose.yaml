services:
  epilykos:
    image: irunmole/epilykos:dev
    container_name: epilykos
    restart: unless-stopped
    ports:
      - "8095:3000"
    volumes:
      - ./data:/app/data
    environment:
      - SETTINGS_PASSWORD=spiceenergy
      - TZ=Africa/Lagos
      - BMS_BRIDGE_URL=http://bms-bridge:8000
    depends_on:
      - bms-bridge
    networks:
      - epilykos-net
    extra_hosts:
      - "bms-bridge:host-gateway"

  bms-bridge:
    image: irunmole/epilykos-bms:dev
    container_name: bms-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - LOG_LEVEL=info
    # No networks section – host network already provides connectivity

networks:
  epilykos-net:
    driver: bridge

