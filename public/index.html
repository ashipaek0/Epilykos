<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epilykos – Energy Monitor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%233b82f6'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E⚡%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <!-- CSRF protection -->
  <script>
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      if (options.method && options.method.toUpperCase() !== 'GET') {
        options.headers = options.headers || {};
        if (options.headers instanceof Headers) {
          options.headers.set('X-Requested-With', 'XMLHttpRequest');
        } else {
          options.headers['X-Requested-With'] = 'XMLHttpRequest';
        }
      }
      return originalFetch.call(this, url, options);
    };
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <img id="logo-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%233b82f6'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E⚡%3C/text%3E%3C/svg%3E" alt="Logo" style="height:40px; margin-right:1rem;">
        <h1 id="dashboard-title">⚡ Epilykos</h1>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
          <span class="theme-icon">🌙</span>
        </button>
        <a href="/settings" class="settings-link">⚙️ Settings</a>
      </div>
    </header>

    <!-- Empty container for modular dashboard blocks -->
    <div id="dashboard-container"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
