# Unit/fixture tests for Epilykos.
#
# This workflow is deliberately SEPARATE from docker-build-dev.yml and
# docker-build.yml, and is non-blocking: a red test run does NOT stop the
# image build/push. It reports status only. Do not fold these steps into a
# build workflow — the operator's chosen semantics are "report, don't block".
name: Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile base image (node:22-slim), so CI tests the
          # same runtime that ships to production.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # test/run-all.js auto-discovers every test/*.test.js, so this single
      # command covers every fixture.
      - name: Run tests
        run: npm test

  # Report-only: Epilykos is built and shipped for Linux (Docker, EpilykosOS).
  # This job shows what breaks when the same fixtures run on Windows, as the
  # to-do list for a Windows package. It never fails the workflow; the failing
  # fixtures are listed in the job summary.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # better-sqlite3 and serialport ship ready-made Windows binaries, but npm
      # still tries to compile better-sqlite3 here, and node-gyp does not know
      # the runner's Visual Studio. Skipping the install scripts uses the shipped
      # binaries.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run tests
        id: tests
        shell: bash
        continue-on-error: true
        run: npm test 2>&1 | tee test-run.log

      - name: List failures
        if: always()
        shell: bash
        run: |
          {
            echo '## Windows fixture results'
            grep -E '^(run-all\.js:|\[FAIL\])' test-run.log || echo 'No summary line found; see the Run tests step.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
