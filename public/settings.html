<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Epilykos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* All existing styles – keep as is */
    .settings-form { background: var(--card-bg); padding: 2rem; border-radius: 1rem; max-width: 1000px; margin: 2rem auto; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: var(--text); }
    input, select { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text); font-size: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; }
    .status { padding: 0.5rem; border-radius: 0.5rem; margin-top: 0.5rem; }
    .success { background: #10b98120; color: #10b981; }
    .error { background: #ef444420; color: #ef4444; }
    .info { background: #3b82f620; color: #3b82f6; }
    h3 { margin: 2rem 0 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: var(--text); }
    h4 { color: var(--text); margin: 1.5rem 0 0.5rem; }
    .fetch-btn { background: var(--text-secondary); margin-top: 0.5rem; }
    .toggle-group { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
    .test-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .test-status { margin-left: 1rem; font-size: 0.9rem; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; color: var(--text-secondary); }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 2rem; cursor: pointer; font-size: 1.2rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .backup-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #restore-file, #import-layout-file { display: none; }

    /* Tab styling */
    .main-tabs { display: flex; flex-wrap: nowrap; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); -webkit-overflow-scrolling: touch; }
    .main-tab-btn { white-space: nowrap; flex-shrink: 0; padding: 0.5rem 1rem; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 0.5rem; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; margin: 0; }
    .main-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .main-tab-btn:hover { background: var(--accent); color: white; }

    .sub-tabs { display: flex; flex-wrap: nowrap; gap: 0.5rem; margin-bottom: 1.2rem; overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
    .sub-tab-btn { white-space: nowrap; flex-shrink: 0; padding: 0.4rem 0.8rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 0.4rem; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .sub-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .sub-tab-btn:hover { background: var(--accent); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .sub-tab-content { display: none; }
    .sub-tab-content.active { display: block; }

    .device-card { background: var(--bg); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; }
    .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .device-header input[type="text"] { flex: 1 1 100%; }
    .remove-btn { background: #ef4444; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 0.5rem; cursor: pointer; margin: 0; }
    .mappings-section { margin-top: 0.5rem; padding-left: 1rem; border-left: 2px solid var(--accent); }
    .metric-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .metric-row input { flex: 1; min-width: 80px; }
    .metric-row select { flex: 1; min-width: 120px; }
    .remove-metric { flex-shrink: 0; padding: 0.3rem 0.6rem; margin: 0; }

    .metrics-table { width: 100%; border-collapse: collapse; }
    .metrics-table th, .metrics-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    .metrics-table th { background: var(--bg); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 1rem; min-width: 300px; max-width: 500px; }

    @media (max-width: 600px) {
      .settings-form { padding: 1rem; margin: 1rem 0.5rem; }
      .form-row { grid-template-columns: 1fr; gap: 0.5rem; }
      .main-tabs, .sub-tabs { gap: 0.3rem; }
      .main-tab-btn, .sub-tab-btn { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
      button { width: 100%; margin-right: 0; margin-bottom: 0.5rem; }
      .backup-row button { width: auto; }
    }
  </style>
  <script>
    // CSRF helper
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      if (options.method && options.method.toUpperCase() !== 'GET') {
        options.headers = options.headers || {};
        if (options.headers instanceof Headers) {
          options.headers.set('X-Requested-With', 'XMLHttpRequest');
        } else {
          options.headers['X-Requested-With'] = 'XMLHttpRequest';
        }
      }
      return originalFetch.call(this, url, options);
    };
  </script>
</head>
<body>
<div class="container">
  <div class="settings-header">
    <a href="/" class="back-link">← Back to Dashboard</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
  <div class="settings-form">
    <h2>Configuration</h2>

    <!-- Main tabs -->
    <div class="main-tabs" id="main-tabs" role="tablist">
      <button class="main-tab-btn active" data-tab="data-sources" aria-selected="true">Data Sources</button>
      <button class="main-tab-btn" data-tab="metrics" aria-selected="false">Metrics</button>
      <button class="main-tab-btn" data-tab="solar" aria-selected="false">Solar Forecast</button>
      <button class="main-tab-btn" data-tab="dashboard" aria-selected="false">Dashboard Layout</button>
      <button class="main-tab-btn" data-tab="backup" aria-selected="false">Backup & Restore</button>
      <button class="main-tab-btn" data-tab="branding" aria-selected="false">Branding & Savings</button>
    </div>

    <form id="settings-form">
      <!-- Tab 1: Data Sources (with sub-tabs) -->
      <div id="tab-data-sources" class="tab-content active">
        <div class="sub-tabs" id="data-source-subtabs">
          <button class="sub-tab-btn active" data-subtab="ha">Home Assistant</button>
          <button class="sub-tab-btn" data-subtab="mqtt">MQTT</button>
          <button class="sub-tab-btn" data-subtab="modbus">Modbus</button>
          <button class="sub-tab-btn" data-subtab="external">External REST</button>
          <button class="sub-tab-btn" data-subtab="bms">Bluetooth BMS</button>
        </div>
        
        <div id="subtab-ha" class="sub-tab-content active">
          <div id="ha-devices-container"></div>
          <button type="button" id="add-ha-device" class="fetch-btn">+ Add HA Device</button>
        </div>

        <div id="subtab-mqtt" class="sub-tab-content">
          <div id="mqtt-devices-container"></div>
          <button type="button" id="add-mqtt-device" class="fetch-btn">+ Add MQTT Broker</button>
        </div>

        <div id="subtab-modbus" class="sub-tab-content">
          <div id="modbus-devices-container"></div>
          <button type="button" id="add-modbus-device" class="fetch-btn">+ Add Modbus Device</button>
        </div>

        <div id="subtab-external" class="sub-tab-content">
          <div id="external-sources-container"></div>
          <button type="button" id="add-external-source" class="fetch-btn">+ Add External Source</button>
          <div class="form-group" style="margin-top:1rem;">
            <label>Global Poll Interval (seconds)</label>
            <input name="external_poll_interval" value="60">
          </div>
        </div>

        <div id="subtab-bms" class="sub-tab-content">
          <div id="bms-devices-container"></div>
          <button type="button" id="add-bms-device" class="fetch-btn">+ Add BMS Device</button>
          <div class="note">Requires the BMS bridge container to be running.</div>
        </div>
      </div>

      <!-- Tab 2: Metrics -->
      <div id="tab-metrics" class="tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3 style="margin:0;">Metrics Management</h3>
          <button type="button" id="create-metric-btn" class="fetch-btn">+ New Metric</button>
        </div>
        <div id="metrics-table-container">
          <table class="metrics-table">
            <thead>
              <tr><th>Metric Name</th><th>Current Value</th><th>Last Updated</th><th>Unit</th><th>Actions</th></tr>
            </thead>
            <tbody id="metrics-table-body"><tr><td colspan="5">Loading metrics...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Tab 3: Solar Forecast -->
      <div id="tab-solar" class="tab-content">
        <div class="toggle-group"><label><input type="checkbox" name="forecast_enabled"> Enable Solar Forecast</label></div>
        <div class="form-row"><div class="form-group"><label>Latitude</label><input name="solar_latitude"></div><div class="form-group"><label>Longitude</label><input name="solar_longitude"></div></div>
        <div class="form-row"><div class="form-group"><label>Panel Tilt (degrees)</label><input name="solar_tilt" value="30"></div><div class="form-group"><label>Panel Azimuth (degrees)</label><input name="solar_azimuth" value="180"></div></div>
        <div class="form-row"><div class="form-group"><label>System Capacity (kWp)</label><input name="solar_capacity_kwp"></div><div class="form-group"><label>Solcast API Key (optional)</label><input type="password" name="solcast_api_key" autocomplete="off"></div></div>
        <div class="form-row"><div class="form-group"><label>Solcast Resource ID</label><input name="solcast_resource_id"></div><div class="form-group"><label>System Loss Factor</label><input name="solar_loss_factor" value="0.9"></div></div>
        <div class="form-row"><div class="form-group"><label>Installation Date</label><input name="solar_install_date" placeholder="2020-01-01"></div></div>
        <div class="test-row"><button type="button" id="test-forecast" class="fetch-btn">Test Forecast</button><span id="forecast-test-status" class="test-status"></span></div>
      </div>

      <!-- Tab 4: Dashboard Layout -->
      <div id="tab-dashboard" class="tab-content">
        <div id="dashboard-editor"><div id="dashboards-list"></div><button type="button" id="add-dashboard-btn" class="fetch-btn">+ New Dashboard</button><div id="active-dashboard-editor" style="margin-top:1rem;"></div></div>
        <div class="backup-row" style="margin-top:1rem;"><button type="button" id="export-layout-btn" class="fetch-btn">📤 Export Layout</button><button type="button" id="import-layout-btn" class="fetch-btn">📥 Import Layout</button><input type="file" id="import-layout-file" accept=".json"></div>
      </div>

      <!-- Tab 5: Backup & Restore -->
      <div id="tab-backup" class="tab-content"><div class="backup-row"><button type="button" id="backup-btn" class="fetch-btn">⬇️ Download Backup</button><button type="button" id="restore-btn" class="fetch-btn">⬆️ Restore Backup</button><input type="file" id="restore-file" accept=".db"></div><div id="backup-status" class="status"></div></div>

      <!-- Tab 6: Branding & Savings -->
      <div id="tab-branding" class="tab-content">
        <h3>Branding</h3><div class="form-group"><label>Dashboard Title</label><input name="dashboard_title" value="⚡ Epilykos"></div><div class="form-group"><label>Logo URL</label><input name="dashboard_logo"></div>
        <h3>Savings Calculation</h3><div class="form-row"><div class="form-group"><label>Currency Symbol</label><input name="savings_currency" value="€"></div><div class="form-group"><label>Rate per kWh</label><input name="savings_rate" value="0.30"></div></div>
      </div>

      <div style="margin-top:2rem; text-align:center;"><button type="submit">Save All Settings</button></div>
      <div id="save-status" class="status"></div>
    </form>
  </div>
</div>

<!-- Modal for creating new metric (handled by settings.js) -->
<div id="metric-modal" class="modal">
  <div class="modal-content">
    <h3>Create New Metric</h3>
    <div class="form-group"><label>Metric Name</label><input type="text" id="new-metric-name"></div>
    <div class="form-group"><label>Unit (optional)</label><input type="text" id="new-metric-unit"></div>
    <div style="display:flex; gap:1rem; justify-content:flex-end;"><button type="button" id="modal-cancel">Cancel</button><button type="button" id="modal-create" class="fetch-btn">Create</button></div>
  </div>
</div>

<script>
  // Theme toggle
  function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const toggle = document.getElementById('theme-toggle');
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      toggle.innerHTML = '☀️';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      toggle.innerHTML = '🌙';
    }
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const newTheme = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    const toggle = document.getElementById('theme-toggle');
    toggle.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
  }
  initTheme();
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // Main tab switching (no extra logic – only UI)
  const mainTabs = document.querySelectorAll('.main-tab-btn');
  const mainContents = document.querySelectorAll('.tab-content');
  function switchMainTab(tabId) {
    mainTabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    const activeTab = document.querySelector(`.main-tab-btn[data-tab="${tabId}"]`);
    if (activeTab) { activeTab.classList.add('active'); activeTab.setAttribute('aria-selected', 'true'); }
    mainContents.forEach(c => c.classList.remove('active'));
    const activeContent = document.getElementById(`tab-${tabId}`);
    if (activeContent) activeContent.classList.add('active');
  }
  mainTabs.forEach(tab => {
    tab.addEventListener('click', () => switchMainTab(tab.getAttribute('data-tab')));
    tab.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const tabs = Array.from(mainTabs);
        const idx = tabs.indexOf(tab);
        const dir = e.key === 'ArrowLeft' ? -1 : 1;
        const next = tabs[(idx + dir + tabs.length) % tabs.length];
        switchMainTab(next.getAttribute('data-tab'));
      }
    });
  });

  // Sub-tab switching
  const subTabs = document.querySelectorAll('.sub-tab-btn');
  const subContents = document.querySelectorAll('.sub-tab-content');
  function switchSubTab(subId) {
    subTabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    const activeSub = document.querySelector(`.sub-tab-btn[data-subtab="${subId}"]`);
    if (activeSub) { activeSub.classList.add('active'); activeSub.setAttribute('aria-selected', 'true'); }
    subContents.forEach(c => c.classList.remove('active'));
    const activeContent = document.getElementById(`subtab-${subId}`);
    if (activeContent) activeContent.classList.add('active');
  }
  subTabs.forEach(tab => {
    tab.addEventListener('click', () => switchSubTab(tab.getAttribute('data-subtab')));
    tab.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const tabs = Array.from(subTabs);
        const idx = tabs.indexOf(tab);
        const dir = e.key === 'ArrowLeft' ? -1 : 1;
        const next = tabs[(idx + dir + tabs.length) % tabs.length];
        switchSubTab(next.getAttribute('data-subtab'));
      }
    });
  });
</script>
<script src="settings.js"></script>
</body>
</html>
