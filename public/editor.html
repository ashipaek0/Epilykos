<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard Editor - Epilykos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@13.2.0/dist/gridstack.min.css">
  <script src="https://cdn.jsdelivr.net/npm/gridstack@13.2.0/dist/gridstack-all.js"></script>
  <style>
    /* Editor-specific styles */
    body { background: var(--bg); margin: 0; padding: 0.5rem; }
    .container { max-width: 100% !important; margin: 0 !important; }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .editor-title { font-size: 1.5rem; font-weight: 600; margin: 0; }
    .editor-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .editor-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .editor-btn:hover { background: var(--accent-strong); }
    .editor-btn.danger { background: #ef4444; }
    .editor-btn.danger:hover { background: #dc2626; }
    .editor-btn.secondary { background: var(--border); color: var(--text); }
    .editor-btn.secondary:hover { background: var(--bg); }
    .editor-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .editor-layout {
      display: grid;
      grid-template-columns: 260px 1fr 280px;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Left panel – block palette */
    .blocks-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }
    .blocks-panel h3 { margin-bottom: 1rem; font-size: 1rem; }
    .block-item {
      background: var(--bg);
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
      cursor: grab;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      transition: all 0.2s;
      user-select: none;
    }
    .block-item:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .block-item:active { cursor: grabbing; }

    /* Main editor grid */
    .editor-grid-wrapper {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      min-height: 500px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .grid-stack { background: transparent; }
    .grid-stack-item-content {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      height: 100%;
      overflow: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: border 0.2s;
    }
    .grid-stack-item-content.placeholder {
      opacity: 0.6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Right panel – settings and history */
    .settings-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }
    .settings-panel h3 { margin-bottom: 1rem; font-size: 1rem; }
    .info-box {
      background: #fef3c7;
      color: #92400e;
      border-left: 4px solid #f59e0b;
      padding: 0.75rem;
      border-radius: 0.4rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    [data-theme="dark"] .info-box {
      background: #78350f;
      color: #fcd34d;
    }

    /* Block header inside grid item */
    .grid-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
    }
    .grid-item-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .grid-item-settings,
    .grid-item-delete {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 0.3rem;
      transition: background 0.2s;
    }
    .grid-item-settings {
      color: var(--text-secondary);
      background: var(--card-bg, #fff);
      border: 1px solid var(--border);
      width: 36px; height: 36px;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .grid-item-settings:hover { background: var(--border); color: var(--accent); }
    .grid-item-delete {
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 50%;
      width: 24px; height: 24px;
      padding: 0;
      font-size: 12px;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .grid-item-delete:hover { background: #dc2626; }

    /* Settings modal row remove buttons */
    .row-remove-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger, #ef4444);
      cursor: pointer;
      border-radius: 0.4rem;
      font-size: 0.85rem;
      min-width: 44px;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: all 0.15s;
      font-family: var(--font, inherit);
    }
    .row-remove-btn:hover {
      background: #ef444415;
      border-color: #ef4444;
    }

    .grid-item-preview { flex: 1; overflow: auto; min-height: 100px; }

    /* Drag handle for grid items */
    .grid-stack-item > .grid-stack-item-content::before {
      content: '⋮⋮';
      position: absolute;
      top: 0.3rem;
      left: 0.5rem;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: grab;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .grid-stack-item:hover > .grid-stack-item-content::before { opacity: 1; }

    /* Unsaved indicator */
    .unsaved-indicator {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #fbbf24;
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      z-index: 1000;
      display: none;
    }
    .unsaved-indicator.show { display: block; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1200px) {
      .editor-layout { grid-template-columns: 1fr; gap: 1rem; }
      .blocks-panel, .settings-panel { max-height: none; }
    }
    @media (max-width: 768px) {
      .editor-header { flex-direction: column; align-items: stretch; }
      .editor-controls { justify-content: center; }
    }
  </style>
  <!-- CSRF protection -->
  <script defer src="js/csrf.js"></script>
</head>
<body>
<div class="container">
  <div class="editor-header">
    <h1 class="editor-title">⚡ Dashboard Editor</h1>
    <div class="editor-controls">
      <button id="new-dash-btn" class="editor-btn secondary" title="New Dashboard">+ New</button>
      <button id="delete-dash-btn" class="editor-btn danger" title="Delete Dashboard">🗑 Delete</button>
      <button id="save-btn" class="editor-btn">💾 Save & Exit</button>
      <a href="/" class="editor-btn secondary" style="text-decoration:none;">← Back</a>
    </div>
  </div>

  <div class="editor-layout">
    <!-- LEFT: Add Blocks Panel -->
    <div class="blocks-panel">
      <h3>📦 Available Blocks</h3>
      <div id="available-blocks"></div>
    </div>

    <!-- CENTER: Grid Editor -->
    <div class="editor-grid-wrapper">
      <div class="grid-stack" id="grid"></div>
    </div>

    <!-- RIGHT: Settings Panel -->
    <div class="settings-panel">
      <h3>⚙️ Dashboards</h3>
      <div style="margin-bottom: 1rem;">
        <label for="tab-select" style="display:block; margin-bottom:0.5rem; font-weight:500;">Switch to:</label>
        <select id="tab-select" style="width:100%; padding:0.5rem;"></select>
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; margin-bottom:0.25rem; font-weight:500;">Rename:</label>
        <input type="text" id="dash-name-input" style="width:100%; padding:0.5rem;" placeholder="Dashboard name">
      </div>
      <div class="info-box">
        💡 Click a block to add it to the grid. Drag to rearrange. Drag edges to resize. Click ✕ to remove.
      </div>
      <div>
        <button id="export-btn" class="editor-btn secondary" style="width:100%; margin-bottom:0.5rem;">📥 Export Layout</button>
        <button id="import-btn" class="editor-btn secondary" style="width:100%;">📤 Import Layout</button>
      </div>
    </div>
  </div>

  <div id="unsaved-indicator" class="unsaved-indicator">⚠️ You have unsaved changes</div>
</div>

<!-- Settings Modal -->
<div id="settings-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:5000;align-items:center;justify-content:center;">
  <div id="settings-modal" style="background:var(--card-bg);border-radius:var(--radius);padding:0;width:min(560px, 95vw);max-height:85vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.3);position:relative;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card-bg);z-index:1;">
      <h3 style="margin:0;font-size:1.1rem;">⚙ Block Settings</h3>
      <button id="settings-modal-close" style="background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-secondary);padding:0.25rem 0.5rem;border-radius:0.3rem;min-width:44px;min-height:44px;" aria-label="Close">✕</button>
    </div>
    <div id="settings-modal-body" style="padding:1rem 1.25rem;flex:1;overflow-y:auto;"></div>
    <div style="display:flex;gap:0.5rem;padding:1rem 1.25rem;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card-bg);">
      <button id="settings-modal-save" style="background:var(--accent);color:white;border:none;padding:0.6rem 1.5rem;border-radius:0.5rem;cursor:pointer;font-size:0.95rem;min-height:44px;min-width:44px;">💾 Save</button>
      <button id="settings-modal-cancel" style="background:var(--border);color:var(--text);border:none;padding:0.6rem 1.5rem;border-radius:0.5rem;cursor:pointer;font-size:0.95rem;min-height:44px;min-width:44px;">Cancel</button>
    </div>
    <div id="settings-modal-status" style="display:none;padding:0.5rem 1.25rem;font-size:0.85rem;color:var(--danger,#dc2626);border-top:1px solid var(--border);"></div>
  </div>
</div>

<script type="module" src="js/editor.js"></script>
</body>
</html>
