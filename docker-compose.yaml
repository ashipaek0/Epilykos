services:
  epilykos:
    image: irunmole/epilykos:latest
    container_name: epilykos
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - SETTINGS_PASSWORD=
      - TZ=Africa/Lagos
      - BMS_BRIDGE_URL=http://bms-bridge:8020
    depends_on:
      - bms-bridge
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"     # RS232 serial passthrough
    group_add:
      - "dialout"                        # Serial port permissions
    networks:
      - epilykos-net

  bms-bridge:
    image: irunmole/epilykos-bms:latest
    container_name: bms-bridge
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev:ro
    environment:
      - LOG_LEVEL=debug
    networks:
      - epilykos-net

networks:
  epilykos-net:
    driver: bridge
