name: Build and Push Dev Images (Multi‑Arch)

on:
  push:
    branches:
      - dev

# Checkout only; Docker Hub and the epilykos-os dispatch use their own secrets,
# and artifacts use the runner's own token — GITHUB_TOKEN needs nothing more.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        service:
          - name: epilykos
            context: .
            dockerfile: ./Dockerfile
            tag: irunmole/epilykos:dev
    steps:
      - name: Check out code (with tags, for the version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Which build this is, written into the image (Settings → Updates shows it
      # and compares it with the update feed).
      - name: Build identity
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_id=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # The version comes from git tags (.github/scripts/version.js): the next
      # release as a pre-release, e.g. 1.0.3-dev+abc1234.
      - name: Version
        id: version
        run: |
          v="$(node .github/scripts/version.js dev)"
          echo "$v"
          echo "version=$(jq -r .version <<<"$v")" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.service.tag }}
          build-args: |
            EPILYKOS_CHANNEL=dev
            EPILYKOS_VERSION=${{ steps.version.outputs.version }}
            EPILYKOS_BUILD_ID=${{ steps.meta.outputs.build_id }}
            EPILYKOS_COMMIT=${{ github.sha }}
            EPILYKOS_BUILT_AT=${{ steps.meta.outputs.built_at }}

      # Record the immutable digest of what was just pushed. EpilykosOS
      # application manifests pin images by digest (C-UPDATE-002), never by tag.
      - name: Record image digest
        env:
          IMAGE_TAG: ${{ matrix.service.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service.name }}
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo="${IMAGE_TAG%:*}"
          echo "### ${SERVICE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${repo}@${IMAGE_DIGEST}\` (tag \`${IMAGE_TAG}\`, commit \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          printf '{"service":"%s","image":"%s","digest":"%s","tag":"%s","commit":"%s","ref":"%s","version":"%s","build_id":"%s","built_at":"%s"}\n' \
            "$SERVICE" "$repo" "$IMAGE_DIGEST" "$IMAGE_TAG" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$VERSION" "$BUILD_ID" "$BUILT_AT" > "digest-${SERVICE}.json"

      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service.name }}
          path: digest-${{ matrix.service.name }}.json
          retention-days: 90

  # Update feed: add this build to dev.json on the update-feed branch, which
  # Settings → Updates reads to tell whether a newer build exists and what
  # changed (.github/scripts/update-feed.js).
  publish-update-feed:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code (with history, for the change notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect digest records
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Publish to the update-feed branch
        run: |
          git config user.name ashipaek0
          git config user.email folabiklan@gmail.com
          if git ls-remote --exit-code --heads origin update-feed >/dev/null; then
            git fetch origin update-feed
            git worktree add feed FETCH_HEAD
          else
            git worktree add --detach feed
            (cd feed && git checkout --orphan update-feed && git rm -rfq .)
          fi
          node .github/scripts/update-feed.js dev digests/digest-epilykos.json feed/dev.json
          cd feed
          git add dev.json
          git commit -qm "dev: build ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA::7})"
          # dev and main builds can finish together: rebase onto the other's feed commit and retry.
          for i in 1 2 3; do
            git push origin HEAD:update-feed && exit 0
            git pull --rebase origin update-feed
          done
          exit 1

  # Bridge to EpilykosOS (C-RELEASE-001): hand the digest records of this
  # build to ashipaek0/epilykos-os, which opens a pull request updating its
  # application manifest. Merging that PR is the human trust decision; nothing
  # reaches an appliance automatically. Skipped (build still green) when the
  # EPILYKOS_OS_DISPATCH_TOKEN secret is not configured.
  notify-epilykos-os:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Collect digest records
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Dispatch to epilykos-os
        env:
          DISPATCH_TOKEN: ${{ secrets.EPILYKOS_OS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::EPILYKOS_OS_DISPATCH_TOKEN not set; epilykos-os not notified"
            exit 0
          fi
          payload="$(jq -cs '{event_type: "app-image-published", client_payload: {ref: .[0].ref, commit: .[0].commit, records: .}}' digests/*.json)"
          echo "$payload" | jq .
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ashipaek0/epilykos-os/dispatches \
            -d "$payload"
