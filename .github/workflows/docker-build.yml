name: Build and Push Main Images (Multi‑Arch)

on:
  push:
    branches:
      - main
    # Docs-only merges change nothing in the image: no build, no new version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Weekly rebuild of the released image even without new commits, so the
  # base image's Debian/Node security updates and Tailscale's latest stable
  # release reach users. Scheduled runs use the default branch (main). The
  # new digest goes to epilykos-os like any build; merging its PR is still the
  # human step before appliances get it.
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:       # "Run workflow" button for an out-of-band rebuild
  # A release you create on GitHub (Releases -> Draft a new release, tag
  # v2.0.0 on main) builds that version; later merges count on from it.
  release:
    types: [published]

# One main build at a time, so two quick merges never get the same version.
concurrency:
  group: docker-build-main
  cancel-in-progress: false

# Checkout only; Docker Hub and the epilykos-os dispatch use their own secrets,
# and artifacts use the runner's own token — GITHUB_TOKEN needs nothing more.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    # A pre-release created by hand is not a release of the main image.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_new: ${{ steps.version.outputs.is_new }}
    strategy:
      matrix:
        service:
          - name: epilykos
            context: .
            dockerfile: ./Dockerfile
            tag: irunmole/epilykos:latest
    steps:
      - name: Check out code (with tags, for the version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Which build this is, written into the image (Settings → Updates shows it
      # and compares it with the update feed).
      - name: Build identity
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_id=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # The version comes from git tags (.github/scripts/version.js), not package.json.
      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            v="$(node .github/scripts/version.js release "$RELEASE_TAG")"
          else
            v="$(node .github/scripts/version.js main)"
          fi
          echo "$v"
          echo "version=$(jq -r .version <<<"$v")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' <<<"$v")" >> "$GITHUB_OUTPUT"
          echo "is_new=$(jq -r .isNew <<<"$v")" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ matrix.service.tag }}
            irunmole/epilykos:${{ steps.version.outputs.version }}
          build-args: |
            EPILYKOS_CHANNEL=latest
            EPILYKOS_VERSION=${{ steps.version.outputs.version }}
            EPILYKOS_BUILD_ID=${{ steps.meta.outputs.build_id }}
            EPILYKOS_COMMIT=${{ github.sha }}
            EPILYKOS_BUILT_AT=${{ steps.meta.outputs.built_at }}

      # Record the immutable digest of what was just pushed. EpilykosOS
      # application manifests pin images by digest (C-UPDATE-002), never by tag.
      - name: Record image digest
        env:
          IMAGE_TAG: ${{ matrix.service.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service.name }}
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
          VERSION: ${{ steps.version.outputs.version }}
          # A release build runs on its tag; it is still the main (stable) channel for epilykos-os.
          REF: ${{ github.event_name == 'release' && 'main' || github.ref_name }}
        run: |
          repo="${IMAGE_TAG%:*}"
          echo "### ${SERVICE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${repo}@${IMAGE_DIGEST}\` (tag \`${IMAGE_TAG}\`, commit \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          printf '{"service":"%s","image":"%s","digest":"%s","tag":"%s","commit":"%s","ref":"%s","version":"%s","build_id":"%s","built_at":"%s"}\n' \
            "$SERVICE" "$repo" "$IMAGE_DIGEST" "$IMAGE_TAG" "$GITHUB_SHA" "$REF" "$VERSION" "$BUILD_ID" "$BUILT_AT" > "digest-${SERVICE}.json"

      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service.name }}
          path: digest-${{ matrix.service.name }}.json
          retention-days: 90

  # Update feed: add this build to latest.json on the update-feed branch, which
  # Settings → Updates reads to tell whether a newer build exists and what
  # changed (.github/scripts/update-feed.js).
  publish-update-feed:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code (with history, for the change notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect digest records
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Publish to the update-feed branch
        run: |
          git config user.name ashipaek0
          git config user.email folabiklan@gmail.com
          if git ls-remote --exit-code --heads origin update-feed >/dev/null; then
            git fetch origin update-feed
            git worktree add feed FETCH_HEAD
          else
            git worktree add --detach feed
            (cd feed && git checkout --orphan update-feed && git rm -rfq .)
          fi
          node .github/scripts/update-feed.js latest digests/digest-epilykos.json feed/latest.json
          cd feed
          git add latest.json
          git commit -qm "latest: build ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA::7})"
          # dev and main builds can finish together: rebase onto the other's feed commit and retry.
          for i in 1 2 3; do
            git push origin HEAD:update-feed && exit 0
            git pull --rebase origin update-feed
          done
          exit 1

  # A new version: tag the commit and make its GitHub Release (change list
  # from the merged pull requests), only once the image is pushed, so a
  # failed build never uses up a number. Releases made with GITHUB_TOKEN do
  # not start this workflow again.
  release:
    needs: build-and-push
    if: needs.build-and-push.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Epilykos $VERSION" --generate-notes --latest

  # Bridge to EpilykosOS (C-RELEASE-001): hand the digest records of this
  # build to ashipaek0/epilykos-os, which opens a pull request updating its
  # application manifest. Merging that PR is the human trust decision; nothing
  # reaches an appliance automatically. Skipped (build still green) when the
  # EPILYKOS_OS_DISPATCH_TOKEN secret is not configured.
  notify-epilykos-os:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Collect digest records
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Dispatch to epilykos-os
        env:
          DISPATCH_TOKEN: ${{ secrets.EPILYKOS_OS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::EPILYKOS_OS_DISPATCH_TOKEN not set; epilykos-os not notified"
            exit 0
          fi
          payload="$(jq -cs '{event_type: "app-image-published", client_payload: {ref: .[0].ref, commit: .[0].commit, records: .}}' digests/*.json)"
          echo "$payload" | jq .
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ashipaek0/epilykos-os/dispatches \
            -d "$payload"
