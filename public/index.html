<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epilykos – Energy Monitor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <!-- CSRF protection -->
  <script>
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      if (options.method && options.method.toUpperCase() !== 'GET') {
        options.headers = options.headers || {};
        if (options.headers instanceof Headers) {
          options.headers.set('X-Requested-With', 'XMLHttpRequest');
        } else {
          options.headers['X-Requested-With'] = 'XMLHttpRequest';
        }
      }
      return originalFetch.call(this, url, options);
    };
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <img id="logo-img" src="" alt="Logo" style="height:40px; margin-right:1rem; display:none;">
        <h1 id="dashboard-title"></h1>
      </div>
      <div class="header-right">
        <a href="/login" class="settings-link" id="signin-btn">Sign in</a>
        <a href="/api/logout" class="settings-link" id="signout-btn" title="Sign out" style="display:none;">Sign out</a>
        <a href="/settings" class="settings-link" id="settings-btn" style="display:none;">⚙️ Settings</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Empty container for modular dashboard blocks -->
    <div id="dashboard-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
