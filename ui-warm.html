<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epilykos — Warm Residential</title>
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --stone-50:  #fafaf9;
    --stone-100: #f5f4f0;
    --stone-200: #e7e5e0;
    --stone-300: #d6d3cc;
    --stone-500: #787670;
    --stone-700: #44403c;
    --stone-900: #1c1917;
    
    --amber-400: #f59e0b;
    --amber-500: #d97706;
    --amber-50:  #fffbeb;
    --amber-100: #fef3c7;
    
    --olive-500: #84a45a;
    --olive-600: #6b8e42;
    
    --sky-500:  #87aec8;
    
    --surface:  var(--stone-50);
    --surface-raised: #ffffff;
    --text-primary: var(--stone-900);
    --text-secondary: var(--stone-500);
    --border: var(--stone-200);
    --accent: var(--amber-400);
    --accent-strong: var(--amber-500);
    --radius: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--stone-100);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: var(--surface-raised);
    border-radius: 20px;
    padding: 2rem;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .card-header h2 {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .card-header .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--stone-500);
    background: var(--stone-100);
    padding: 0.35rem 0.75rem;
    border-radius: 100px;
  }
  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--olive-500);
    box-shadow: 0 0 0 2px rgba(132,164,90,.25);
  }

  /* ============ FLOW CARD ============ */
  .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: var(--stone-50);
    border-radius: var(--radius);
    padding: 1.5rem 1rem;
    border: 1px solid var(--border);
  }

  .node {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.5rem 0.75rem;
    min-width: 72px;
    position: relative;
  }
  .node .icon {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-raised);
    border-radius: 12px;
    margin-bottom: 0.5rem;
    font-size: 1.15rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .node .name {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 0.15rem;
  }
  .node .reading {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  .node .sub {
    font-size: 0.65rem;
    color: var(--text-secondary);
    margin-top: 0.1rem;
    font-weight: 500;
  }

  /* Gauge under solar */
  .node .meter {
    width: 100%;
    margin-top: 0.5rem;
  }
  .meter .track {
    width: 100%; height: 3px;
    background: var(--stone-200);
    border-radius: 2px;
  }
  .meter .fill {
    height: 3px;
    background: var(--amber-400);
    border-radius: 2px;
    width: 42%;
  }
  .meter .cap {
    font-size: 0.55rem;
    color: var(--text-secondary);
    text-align: right;
    margin-top: 2px;
    font-weight: 500;
  }

  /* Arrows */
  .connector {
    display: flex;
    align-items: center;
    padding: 0 0.25rem;
    color: var(--stone-300);
    font-size: 0.9rem;
    font-weight: 500;
  }
  .connector.flowing { color: var(--amber-400); }

  /* ============ METRIC CARDS ============ */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .metric {
    background: var(--stone-50);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem 0.75rem 0.85rem;
    text-align: center;
  }
  .metric .m-icon {
    width: 30px; height: 30px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 0.5rem;
    font-size: 0.85rem;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .metric .m-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 0.15rem;
  }
  .metric .m-value {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ============ SETTINGS INPUT ============ */
  .setting-row {
    margin-top: 1.25rem;
    background: var(--stone-50);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .setting-row .field {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .field label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }
  .field input {
    padding: 0.55rem 0.7rem;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    border-color: var(--amber-400);
    box-shadow: 0 0 0 3px rgba(245,158,11,.12);
  }
  .field .hint {
    font-size: 0.65rem;
    color: var(--text-secondary);
  }

  .color-sample {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .color-sample .swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
    display: inline-block;
  }

  /* ============ PALETTE LEGEND ============ */
  .legend {
    margin-top: 1.25rem;
    display: flex;
    gap: 1rem;
    font-size: 0.65rem;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <h2>Energy Flow</h2>
    <div class="badge">
      <span class="dot"></span> Live
    </div>
  </div>

  <!-- Flow Card -->
  <div class="flow">

    <div class="node">
      <div class="icon" style="color:var(--amber-400)"><i class="fi fi-sr-solar-panel"></i></div>
      <div class="name">Solar</div>
      <div class="reading" style="color:var(--amber-500)">2,847 W</div>
      <div class="meter">
        <div class="track"><div class="fill"></div></div>
        <div class="cap">42% of 6.8 kWp</div>
      </div>
    </div>

    <div class="connector flowing">→</div>

    <div class="node">
      <div class="icon" style="color:var(--olive-500)"><i class="fi fi-sr-battery-full"></i></div>
      <div class="name">Battery</div>
      <div class="reading" style="color:var(--olive-600)">78%</div>
      <div class="sub">Charging · 1,240 W</div>
    </div>

    <div class="connector flowing">→</div>

    <div class="node">
      <div class="icon" style="color:var(--stone-700)"><i class="fi fi-sr-home"></i></div>
      <div class="name">Home</div>
      <div class="reading">1,607 W</div>
    </div>

    <div class="connector">→</div>

    <div class="node">
      <div class="icon" style="color:var(--sky-500)">
        <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor"><path d="M426.5 480h-341l34.3-113.3h272.4L426.5 480zM144.8 334.7l34.3-113.4h153.8l34.3 113.4H144.8zM256 92.2l76.3 99.1h-152.6L256 92.2zM32 32h448v40H32z"/></svg>
      </div>
      <div class="name">Grid</div>
      <div class="reading" style="color:var(--stone-300)">0 W</div>
      <div class="sub">Idle</div>
    </div>

  </div>

  <!-- Metric Cards -->
  <div class="metrics">
    <div class="metric">
      <div class="m-icon" style="color:var(--amber-400)"><i class="fi fi-sr-solar-panel"></i></div>
      <div class="m-label">PV Power</div>
      <div class="m-value" style="color:var(--amber-500)">2.8 kW</div>
    </div>
    <div class="metric">
      <div class="m-icon" style="color:var(--stone-700)"><i class="fi fi-sr-home"></i></div>
      <div class="m-label">Load Power</div>
      <div class="m-value">1.6 kW</div>
    </div>
    <div class="metric">
      <div class="m-icon" style="color:var(--olive-500)"><i class="fi fi-sr-battery-full"></i></div>
      <div class="m-label">Battery SOC</div>
      <div class="m-value" style="color:var(--olive-600)">78%</div>
    </div>
  </div>

  <!-- Settings input example -->
  <div class="setting-row">
    <div class="field">
      <label>Inverter Port</label>
      <input type="text" value="/dev/ttyUSB0" placeholder="/dev/ttyUSB0">
      <span class="hint">USB RS485 adapter — connected</span>
    </div>
  </div>

  <!-- Palette -->
  <div class="legend">
    <span class="color-sample"><span class="swatch" style="background:var(--amber-400)"></span>Solar</span>
    <span class="color-sample"><span class="swatch" style="background:var(--olive-500)"></span>Battery</span>
    <span class="color-sample"><span class="swatch" style="background:var(--stone-700)"></span>Home</span>
    <span class="color-sample"><span class="swatch" style="background:var(--sky-500)"></span>Grid</span>
    <span>·</span>
    <span>Inter · Stone/Amber/Olive palette · 14px radius</span>
  </div>

</div>

</body>
</html>
