<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Energy Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Tab bar styles */
    .settings-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .tab-btn:hover:not(.active) {
      background: var(--card-bg);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    /* Rest of existing styles */
    .settings-form {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 1000px;
      margin: 2rem auto;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: var(--text); }
    input, select {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      font-size: 1rem;
    }
    input::placeholder { color: var(--text-secondary); opacity: 0.6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--accent);
      text-decoration: none;
    }
    .status { padding: 0.5rem; border-radius: 0.5rem; margin-top: 0.5rem; }
    .success { background: #10b98120; color: #10b981; }
    .error { background: #ef444420; color: #ef4444; }
    .info { background: #3b82f620; color: #3b82f6; }
    h3 {
      margin: 2rem 0 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      color: var(--text);
    }
    h4 { color: var(--text); margin: 1.5rem 0 0.5rem; }
    .fetch-btn { background: var(--text-secondary); margin-top: 0.5rem; }
    .toggle-group { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .toggle-group label { margin-bottom: 0; color: var(--text); }
    input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
    .test-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .test-status { margin-left: 1rem; font-size: 0.9rem; }
    .spinner {
      display: inline-block;
      width: 1rem; height: 1rem;
      border: 2px solid #fff3;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; color: var(--text-secondary); }
    
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .theme-toggle {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem; border-radius: 2rem; cursor: pointer; font-size: 1.2rem;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    }
    .backup-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #restore-file, #import-layout-file { display: none; }

    /* Device list */
    .device-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .device-header input[type="text"] {
      flex: 1 1 100%;
    }
    .remove-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .mappings-section {
      margin-top: 0.5rem;
      padding-left: 1rem;
      border-left: 2px solid var(--accent);
    }
    .metric-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .metric-row input {
      flex: 1;
      min-width: 80px;
    }
    .metric-row select {
      flex: 1;
      min-width: 120px;
    }
    .remove-metric {
      flex-shrink: 0;
      padding: 0.3rem 0.6rem;
    }

    /* Dashboard editor */
    .dash-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .dash-row input {
      flex: 1;
    }
    .block-list {
      margin: 0.5rem 0;
      padding: 0;
      list-style: none;
    }
    .block-list li {
      background: var(--card-bg);
      padding: 0.5rem;
      margin-bottom: 0.3rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .block-type-select {
      width: 180px;
      flex: 1;
    }
    .card-editor-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.3rem;
    }
    .card-editor-row input {
      width: auto;
      flex: 1;
    }
    .block-config-panel {
      width: 100%;
      margin-top: 0.5rem;
    }

    /* Mobile responsive */
    @media (max-width: 600px) {
      .settings-form {
        padding: 1rem;
        margin: 1rem 0.5rem;
      }
      .form-row, .test-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .device-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .metric-row {
        flex-direction: column;
        align-items: stretch;
      }
      .metric-row select, .metric-row input {
        width: 100%;
      }
      .block-list li {
        flex-direction: column;
        align-items: flex-start;
      }
      .block-type-select {
        width: 100%;
      }
      .dash-row {
        flex-wrap: wrap;
      }
      button {
        width: 100%;
        margin-right: 0;
        margin-bottom: 0.5rem;
      }
      .backup-row button {
        width: auto;
      }
      .settings-tabs {
        justify-content: center;
      }
      .tab-btn {
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
  <script>
    // CSRF helper
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      if (options.method && options.method.toUpperCase() !== 'GET') {
        options.headers = options.headers || {};
        if (options.headers instanceof Headers) {
          options.headers.set('X-Requested-With', 'XMLHttpRequest');
        } else {
          options.headers['X-Requested-With'] = 'XMLHttpRequest';
        }
      }
      return originalFetch.call(this, url, options);
    };
  </script>
</head>
<body>
<div class="container">
  <div class="settings-header">
    <a href="/" class="back-link">← Back to Dashboard</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
  <div class="settings-form">
    <h2>Configuration</h2>

    <!-- Tab bar -->
    <div class="settings-tabs" id="settings-tabs">
      <button class="tab-btn active" data-tab="data-sources">Data Sources</button>
      <button class="tab-btn" data-tab="solar">Solar Forecast</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard Layout</button>
      <button class="tab-btn" data-tab="backup">Backup & Restore</button>
      <button class="tab-btn" data-tab="branding">Branding & Savings</button>
    </div>

    <form id="settings-form">
      <!-- Tab 1: Data Sources -->
      <div id="tab-data-sources" class="tab-content active">
        <!-- Home Assistant -->
        <h3>Home Assistant Devices</h3>
        <div id="ha-devices-container"></div>
        <button type="button" id="add-ha-device" class="fetch-btn">+ Add HA Device</button>

        <!-- MQTT -->
        <h3>MQTT Brokers</h3>
        <div id="mqtt-devices-container"></div>
        <button type="button" id="add-mqtt-device" class="fetch-btn">+ Add MQTT Broker</button>

        <!-- Modbus -->
        <h3>Modbus Direct</h3>
        <div id="modbus-devices-container"></div>
        <button type="button" id="add-modbus-device" class="fetch-btn">+ Add Modbus Device</button>

        <!-- External REST Sources -->
        <h3>External REST Sources</h3>
        <div id="external-sources-container"></div>
        <button type="button" id="add-external-source" class="fetch-btn">+ Add External Source</button>
        <div class="form-group" style="margin-top: 1rem;">
          <label>Global Poll Interval (seconds)</label>
          <input name="external_poll_interval" value="60" placeholder="60">
          <div class="note">How often to fetch all external sources.</div>
        </div>
      </div>

      <!-- Tab 2: Solar Forecast -->
      <div id="tab-solar" class="tab-content">
        <div class="toggle-group">
          <label><input type="checkbox" name="forecast_enabled" value="true"> Enable Solar Forecast</label>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Latitude</label>
            <input name="solar_latitude" placeholder="e.g., 6.5244">
          </div>
          <div class="form-group">
            <label>Longitude</label>
            <input name="solar_longitude" placeholder="e.g., 3.3792">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Panel Tilt (degrees)</label>
            <input name="solar_tilt" value="30" placeholder="30">
          </div>
          <div class="form-group">
            <label>Panel Azimuth (degrees)</label>
            <input name="solar_azimuth" value="180" placeholder="180 (South)">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>System Capacity (kWp)</label>
            <input name="solar_capacity_kwp" placeholder="e.g., 5.0">
            <div class="note">Total peak power in kilowatts (kWp).</div>
          </div>
          <div class="form-group">
            <label>Solcast API Key (optional)</label>
            <input type="password" name="solcast_api_key" placeholder="Leave empty for Open-Meteo">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Solcast Resource ID (optional)</label>
            <input name="solcast_resource_id" placeholder="e.g., abc1-2345-def6-7890">
            <div class="note">Found in your Solcast site details.</div>
          </div>
          <div class="form-group">
            <label>System Loss Factor (0.7–1.0)</label>
            <input name="solar_loss_factor" value="0.9" placeholder="0.9">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Installation Date</label>
            <input name="solar_install_date" placeholder="2020-01-01">
            <div class="note">Used for panel degradation (Solcast).</div>
          </div>
          <div class="form-group"></div>
        </div>
        <div class="test-row">
          <button type="button" id="test-forecast" class="fetch-btn">Test Forecast</button>
          <span id="forecast-test-status" class="test-status"></span>
        </div>
      </div>

      <!-- Tab 3: Dashboard Layout -->
      <div id="tab-dashboard" class="tab-content">
        <div id="dashboard-editor">
          <div id="dashboards-list"></div>
          <button type="button" id="add-dashboard-btn" class="fetch-btn">+ New Dashboard</button>
          <div id="active-dashboard-editor" style="margin-top:1rem;"></div>
        </div>
        <div class="backup-row" style="margin-top: 1rem;">
          <button type="button" id="export-layout-btn" class="fetch-btn">📤 Export Layout</button>
          <button type="button" id="import-layout-btn" class="fetch-btn">📥 Import Layout</button>
          <input type="file" id="import-layout-file" accept=".json">
        </div>
      </div>

      <!-- Tab 4: Backup & Restore -->
      <div id="tab-backup" class="tab-content">
        <div class="backup-row">
          <button type="button" id="backup-btn" class="fetch-btn">⬇️ Download Backup</button>
          <button type="button" id="restore-btn" class="fetch-btn">⬆️ Restore Backup</button>
          <input type="file" id="restore-file" accept=".db">
        </div>
        <div id="backup-status" class="status"></div>
      </div>

      <!-- Tab 5: Branding & Savings -->
      <div id="tab-branding" class="tab-content">
        <h3>Branding</h3>
        <div class="form-group">
          <label>Dashboard Title</label>
          <input name="dashboard_title" placeholder="My Energy Dashboard" value="⚡ Energy Dashboard">
        </div>
        <div class="form-group">
          <label>Logo URL (optional)</label>
          <input name="dashboard_logo" placeholder="https://example.com/logo.png">
        </div>

        <h3>Savings Calculation</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Currency Symbol</label>
            <input name="savings_currency" value="€" placeholder="€">
          </div>
          <div class="form-group">
            <label>Rate per kWh</label>
            <input name="savings_rate" value="0.30" placeholder="0.30">
          </div>
        </div>
      </div>

      <div style="margin-top: 2rem; text-align: center;">
        <button type="submit">Save All Settings</button>
      </div>
      <div id="save-status" class="status"></div>
    </form>
  </div>
</div>
<script>
  // Theme toggle (same as before)
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const toggle = document.getElementById('theme-toggle');
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      toggle.innerHTML = '<span class="theme-icon">☀️</span>';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      toggle.innerHTML = '<span class="theme-icon">🌙</span>';
    }
  }
  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    const toggle = document.getElementById('theme-toggle');
    toggle.innerHTML = newTheme === 'dark' ? '<span class="theme-icon">☀️</span>' : '<span class="theme-icon">🌙</span>';
  }
  initTheme();
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // Tab switching logic
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabId = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
    });
  });
</script>
<script src="settings.js"></script>
</body>
</html>
