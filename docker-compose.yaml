services:
  epilykos:
    image: irunmole/epilykos:dev
    container_name: epilykos
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro       # Bluetooth BMS / inverter Bluetooth modules: talk to the host's BlueZ over D-Bus. Remove this line if you don't use Bluetooth.
    environment:
      - TZ=Africa/Lagos  # Time zone for day boundaries. Remove this line to follow the host clock. 
    devices:
#      - "/dev/ttyUSB0:/dev/ttyUSB0"     # RS232 serial passthrough
    group_add:
      - "dialout"                        # Serial port permissions
    networks:
      - epilykos-net

networks:
  epilykos-net:
    driver: bridge
