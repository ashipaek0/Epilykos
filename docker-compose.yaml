services:
  epilykos:
    image: irunmole/epilykos:dev
    container_name: epilykos
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - SETTINGS_PASSWORD=spiceenergy
      - TZ=Africa/Lagos
      - BMS_BRIDGE_URL=http://bms-bridge:8020
    depends_on:
      - bms-bridge
    networks:
      - epilykos-net
    extra_hosts:
      - "bms-bridge:host-gateway"

  bms-bridge:
    image: irunmole/epilykos-bms:dev
    container_name: bms-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - LOG_LEVEL=info

networks:
  epilykos-net:
    driver: bridge

