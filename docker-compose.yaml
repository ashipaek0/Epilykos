services:
  epilykos:
    build: .
    container_name: epilykos
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - SETTINGS_PASSWORD=${SETTINGS_PASSWORD}
      - TZ=${TZ:-Africa/Lagos}
      - BMS_BRIDGE_URL=http://bms-bridge:8000
    depends_on:
      - bms-bridge
    networks:
      - epilykos-net

  bms-bridge:
    build: ./bms-bridge
    container_name: bms-bridge
    restart: unless-stopped
    network_mode: host          # required for Bluetooth access
    # For non‑host networking, use privileged and dbus mount:
    # privileged: true
    # volumes:
    #   - /var/run/dbus:/var/run/dbus
    environment:
      - LOG_LEVEL=info
    networks:
      - epilykos-net   # still needed for name resolution (though host networking overrides)

networks:
  epilykos-net:
    driver: bridge
