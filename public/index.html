<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Epilykos – Energy Monitor</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css"></noscript>
  <!-- Chart.js loaded dynamically when chart blocks are present -->
  <!-- CSRF protection -->
  <script defer src="js/csrf.js"></script>
  <!-- Network detection (sends URLs to Service Worker) -->
  <script defer src="js/network-detect.js"></script>
</head>
<body>
  <a href="#dashboard-container" class="skip-link" style="position:absolute;left:-9999px;top:0;z-index:9999;padding:0.5rem 1rem;background:var(--accent);color:#fff;border-radius:0 0 var(--radius) 0">Skip to dashboard</a>
  <div class="container">
    <header>
      <div class="header-left">
        <img id="logo-img" alt="Logo" style="height:40px; margin-right:1rem; display:none;">
        <h1 id="dashboard-title"></h1>
      </div>
      <div class="header-right">
        <a href="/login" class="settings-link" id="signin-btn">Sign in</a>
        <a href="/api/logout" class="settings-link" id="signout-btn" title="Sign out" style="display:none;">Sign out</a>
        <a href="/settings" class="settings-link" id="settings-btn" style="display:none;">⚙️ Settings</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode" style="display:none;">
          <span class="theme-icon">☾</span>
        </button>
      </div>
    </header>

    <!-- Empty container for modular dashboard blocks -->
    <div id="dashboard-container"></div>
    <!-- Screen-reader announcements for live data updates -->
    <div id="aria-live-region" class="sr-only" aria-live="polite" role="status"></div>
  </div>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.debug('[PWA] Service Worker registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
