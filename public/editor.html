<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edit layout · Epilykos</title>
  <link rel="icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint (same rules as js/theme.js).
    (function() {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="/vendor/gridstack/gridstack.min.css">
  <link rel="stylesheet" href="editor.css">
  <script src="/vendor/gridstack/gridstack-all.js"></script>
  <!-- CSRF protection -->
  <script defer src="js/csrf.js"></script>
</head>
<body class="ed">
<a class="ed-skip" href="#ed-canvas">Skip to layout</a>

<header class="ed-topbar">
  <div class="ed-topbar-start">
    <a id="back-link" href="/" class="ed-icon-btn" aria-label="Back to dashboard" data-icon="back"></a>
    <button id="dash-menu-btn" type="button" class="ed-dash-btn" aria-haspopup="menu" aria-expanded="false">
      <span class="ed-dash-name" id="dash-name">Dashboard</span>
      <span class="ed-dash-count" id="dash-count"></span>
      <span data-icon="chevronDown" data-size="16"></span>
    </button>
    <span id="save-status" class="ed-status" role="status" aria-live="polite" data-state="saved"></span>
  </div>
  <div class="ed-topbar-end">
    <button id="library-btn" type="button" class="ed-btn ed-only-narrow" aria-controls="library" aria-expanded="false"><span data-icon="plus" data-size="18"></span><span class="ed-btn-label">Add block</span></button>
    <button id="undo-btn" type="button" class="ed-icon-btn" aria-label="Undo" title="Undo (Ctrl+Z)" data-icon="undo" disabled></button>
    <button id="redo-btn" type="button" class="ed-icon-btn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" data-icon="redo" disabled></button>
    <button id="io-btn" type="button" class="ed-btn ed-only-wide" aria-haspopup="menu" aria-expanded="false">Import / export</button>
    <button id="done-btn" type="button" class="ed-btn ed-btn-primary">Done</button>
  </div>
</header>

<div id="readonly-banner" class="ed-banner" hidden>
  <span data-icon="lock" data-size="18"></span>
  <span class="ed-banner-text">You're viewing this layout. Sign in to make changes.</span>
  <a class="ed-btn ed-btn-info" href="/login">Sign in</a>
</div>

<div class="ed-workspace">
  <aside id="library" class="ed-library ed-sheet" aria-labelledby="library-title">
    <div class="ed-sheet-handle" aria-hidden="true"></div>
    <div class="ed-library-head">
      <div class="ed-panel-titlebar">
        <h2 id="library-title" class="ed-panel-title">Add a block</h2>
        <button type="button" class="ed-icon-btn ed-only-narrow ed-sheet-close" data-close-sheet aria-label="Close block library" data-icon="close"></button>
      </div>
      <div class="ed-search">
        <span data-icon="search" data-size="16"></span>
        <label for="library-search" class="ed-visually-hidden">Search blocks</label>
        <input id="library-search" type="search" autocomplete="off" placeholder="Search blocks">
      </div>
    </div>
    <div id="library-list" class="ed-library-list"></div>
    <p class="ed-library-hint">Drag onto the layout, or press Enter to add below the selected block.</p>
  </aside>

  <main id="ed-canvas" class="ed-canvas" tabindex="-1" aria-label="Dashboard layout">
    <div class="ed-canvas-inner">
      <div class="grid-stack" id="grid"></div>
      <div id="empty-state" class="ed-empty" hidden>
        <h2>This dashboard is empty</h2>
        <p>Add a block from the library to get started.</p>
      </div>
    </div>
  </main>

  <aside id="inspector" class="ed-inspector ed-sheet" aria-label="Block settings"></aside>
</div>

<div id="sheet-scrim" class="ed-scrim" hidden></div>
<div id="ed-toast-region" class="ed-toast-region" role="status" aria-live="polite"></div>
<div id="loading-overlay" class="ed-loading" role="status">
  <div class="ed-spinner" aria-hidden="true"></div>
  <p id="loading-message">Loading editor…</p>
</div>

<script type="module" src="js/editor.js"></script>
</body>
</html>
