<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Settings - Epilykos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* [All your existing styles – unchanged] */
    .settings-form { background: var(--card-bg); padding: 1.5rem; border-radius: 1rem; max-width: 1000px; margin: 2rem auto; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: var(--text); font-size: 0.95rem; }
    input, select { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text); font-size: 1rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); background: var(--card-bg); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; font-weight: 500; }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-weight: 500; }
    .status { padding: 0.75rem; border-radius: 0.5rem; margin-top: 0.5rem; font-size: 0.9rem; }
    .success { background: #10b98120; color: #10b981; border: 1px solid #10b98150; }
    .error { background: #ef444420; color: #ef4444; border: 1px solid #ef444450; }
    .info { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f650; }
    h3 { margin: 2rem 0 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: var(--text); }
    h4 { color: var(--text); margin: 1.5rem 0 0.5rem; }
    .fetch-btn { background: var(--text-secondary); margin-top: 0.5rem; }
    .toggle-group { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    input[type="checkbox"] { width: auto; margin-right: 0.5rem; cursor: pointer; }
    .test-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .test-status { margin-left: 1rem; font-size: 0.9rem; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; color: var(--text-secondary); }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 2rem; cursor: pointer; font-size: 1.2rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .theme-toggle:hover { background: var(--accent); color: white; }
    .backup-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #restore-file, #import-layout-file { display: none; }
    
    /* Enhanced Tab styling for mobile */
    .main-tabs { 
      display: flex; 
      flex-wrap: nowrap; 
      gap: 0.5rem; 
      margin-bottom: 1.5rem; 
      overflow-x: auto; 
      padding-bottom: 0.75rem;
      padding-right: 2rem; /* Scroll indicator space */
      border-bottom: 2px solid var(--border); 
      -webkit-overflow-scrolling: touch; 
      scroll-behavior: smooth;
      position: relative;
    }
    
    /* Scroll indicator for tabs */
    .main-tabs::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 1.5rem;
      background: linear-gradient(to right, rgba(255,255,255,0), var(--card-bg));
      pointer-events: none;
      opacity: 0.8;
    }
    
    [data-theme="dark"] .main-tabs::after {
      background: linear-gradient(to right, rgba(30,41,59,0), var(--card-bg));
    }

    .main-tab-btn { 
      white-space: nowrap; 
      flex-shrink: 0; 
      padding: 0.6rem 1.2rem; 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      color: var(--text); 
      border-radius: 2rem;
      font-size: 0.9rem; 
      cursor: pointer; 
      transition: all 0.2s; 
      margin: 0;
      font-weight: 500;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .main-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .main-tab-btn:hover { background: var(--accent); color: white; }
    .main-tab-btn:active { transform: scale(0.96); }

    .sub-tabs { 
      display: flex; 
      flex-wrap: nowrap; 
      gap: 0.4rem; 
      margin-bottom: 1.2rem; 
      overflow-x: auto; 
      padding-bottom: 0.5rem;
      padding-right: 1.5rem;
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch; 
      scroll-behavior: smooth;
      position: relative;
    }

    /* Scroll indicator for sub-tabs */
    .sub-tabs::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 1rem;
      background: linear-gradient(to right, rgba(255,255,255,0), var(--card-bg));
      pointer-events: none;
      opacity: 0.6;
    }

    [data-theme="dark"] .sub-tabs::after {
      background: linear-gradient(to right, rgba(30,41,59,0), var(--card-bg));
    }

    .sub-tab-btn { 
      white-space: nowrap; 
      flex-shrink: 0; 
      padding: 0.5rem 1rem; 
      background: var(--bg); 
      border: 1px solid var(--border); 
      color: var(--text); 
      border-radius: 2rem;
      font-size: 0.85rem; 
      cursor: pointer; 
      transition: all 0.2s; 
      font-weight: 500;
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    .sub-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .sub-tab-btn:hover { background: var(--accent); color: white; }
    .sub-tab-btn:active { transform: scale(0.96); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .sub-tab-content { display: none; }
    .sub-tab-content.active { display: block; }

    .device-card { background: var(--bg); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; }
    .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .device-header input[type="text"] { flex: 1 1 100%; }
    .remove-btn { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; margin: 0; min-height: 36px; font-weight: 500; }
    .mappings-section { margin-top: 0.5rem; padding-left: 1rem; border-left: 2px solid var(--accent); }
    .metric-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .metric-row input { flex: 1; min-width: 80px; }
    .metric-row select { flex: 1; min-width: 120px; }
    .remove-metric { flex-shrink: 0; padding: 0.5rem 1rem; margin: 0; min-height: 36px; }

    .metrics-table { width: 100%; border-collapse: collapse; }
    .metrics-table th, .metrics-table td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .metrics-table th { background: var(--bg); font-weight: 600; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 1rem; min-width: 300px; max-width: 500px; max-height: 90vh; overflow-y: auto; }

    /* Mobile-first responsive design */
    @media (max-width: 768px) {
      .settings-form { padding: 1.2rem; margin: 1rem 0; }
      .form-row { grid-template-columns: 1fr; gap: 0.75rem; }
      .main-tab-btn { font-size: 0.8rem; padding: 0.5rem 1rem; }
      .sub-tab-btn { font-size: 0.75rem; padding: 0.4rem 0.8rem; }
      button { width: auto; min-height: 44px; padding: 0.6rem 1.2rem; font-size: 0.95rem; }
      .backup-row button { width: auto; }
      .test-row { flex-direction: column; align-items: stretch; }
      .test-row button { width: 100%; }
      .metric-row { flex-wrap: wrap; gap: 0.3rem; }
      .metric-row input, .metric-row select { min-width: 100%; }
      .device-header { flex-direction: column; align-items: stretch; }
      .device-header input { width: 100%; }
      h3 { font-size: 1.2rem; margin: 1.5rem 0 0.75rem; }
      label { font-size: 0.9rem; }
      input, select { font-size: 16px; } /* Prevents zoom on iOS */
    }

    @media (max-width: 480px) {
      .settings-form { padding: 1rem; margin: 0.5rem 0; border-radius: 0.75rem; }
      .settings-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .back-link { font-size: 0.9rem; }
      .theme-toggle { width: 36px; height: 36px; font-size: 1rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.1rem; margin: 1.2rem 0 0.6rem; padding-bottom: 0.4rem; }
      .main-tabs { margin-bottom: 1rem; padding-right: 1.5rem; }
      .main-tab-btn { padding: 0.45rem 0.8rem; font-size: 0.75rem; }
      .sub-tab-btn { padding: 0.35rem 0.65rem; font-size: 0.7rem; }
      .form-group { margin-bottom: 1rem; }
      button { padding: 0.5rem 1rem; font-size: 0.9rem; }
      .modal-content { padding: 1.5rem; margin: 0 1rem; }
      .device-card { padding: 0.75rem; margin-bottom: 0.75rem; }
      .status { padding: 0.5rem; font-size: 0.85rem; }
    }
  </style>
  <script>
    // Enhanced fetch override: adds CSRF header AND stringifies array fields for /api/settings
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      // Clone options to avoid mutation
      let newOptions = { ...options };
      if (newOptions.method && newOptions.method.toUpperCase() !== 'GET') {
        newOptions.headers = newOptions.headers || {};
        if (newOptions.headers instanceof Headers) {
          newOptions.headers.set('X-Requested-With', 'XMLHttpRequest');
        } else {
          newOptions.headers['X-Requested-With'] = 'XMLHttpRequest';
        }

        // Special handling for /api/settings POST: stringify array fields
        if (typeof url === 'string' && url.endsWith('/api/settings') && newOptions.method.toUpperCase() === 'POST') {
          if (newOptions.body && typeof newOptions.body === 'string') {
            try {
              let bodyObj = JSON.parse(newOptions.body);
              let modified = false;
              // List of config keys that should be stored as JSON strings
              const arrayKeys = ['mqtt_devices', 'ha_devices', 'modbus_devices', 'external_sources', 'bms_devices', 'user_metrics'];
              for (let key of arrayKeys) {
                if (bodyObj.hasOwnProperty(key) && Array.isArray(bodyObj[key])) {
                  bodyObj[key] = JSON.stringify(bodyObj[key]);
                  modified = true;
                }
              }
              if (modified) {
                newOptions.body = JSON.stringify(bodyObj);
              }
            } catch(e) {
              // If body isn't valid JSON, leave unchanged
              console.warn('Failed to parse settings body for stringification', e);
            }
          }
        }
      }
      return originalFetch.call(this, url, newOptions);
    };
  </script>
</head>
<body>
<div class="container">
  <div class="settings-header">
    <a href="/" class="back-link">← Back to Dashboard</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
  <div class="settings-form">
    <h2>Configuration</h2>

    <!-- Main tabs with scroll indicator -->
    <div class="main-tabs" id="main-tabs" role="tablist">
      <button class="main-tab-btn active" data-tab="data-sources" aria-selected="true" aria-controls="tab-data-sources" role="tab">Data Sources</button>
      <button class="main-tab-btn" data-tab="metrics" aria-selected="false" aria-controls="tab-metrics" role="tab">Metrics</button>
      <button class="main-tab-btn" data-tab="solar" aria-selected="false" aria-controls="tab-solar" role="tab">Solar Forecast</button>
      <button class="main-tab-btn" data-tab="dashboard" aria-selected="false" aria-controls="tab-dashboard" role="tab">Dashboard</button>
      <button class="main-tab-btn" data-tab="backup" aria-selected="false" aria-controls="tab-backup" role="tab">Backup</button>
      <button class="main-tab-btn" data-tab="branding" aria-selected="false" aria-controls="tab-branding" role="tab">Branding</button>
    </div>

    <form id="settings-form">
      <!-- Tab 1: Data Sources (with sub-tabs) -->
      <div id="tab-data-sources" class="tab-content active" role="tabpanel" aria-labelledby="data-sources">
        <div class="sub-tabs" id="data-source-subtabs" role="tablist">
          <button class="sub-tab-btn active" data-subtab="ha" aria-selected="true" aria-controls="subtab-ha" role="tab">Home Assistant</button>
          <button class="sub-tab-btn" data-subtab="mqtt" aria-selected="false" aria-controls="subtab-mqtt" role="tab">MQTT</button>
          <button class="sub-tab-btn" data-subtab="modbus" aria-selected="false" aria-controls="subtab-modbus" role="tab">Modbus</button>
          <button class="sub-tab-btn" data-subtab="external" aria-selected="false" aria-controls="subtab-external" role="tab">REST</button>
          <button class="sub-tab-btn" data-subtab="bms" aria-selected="false" aria-controls="subtab-bms" role="tab">BMS</button>
        </div>
        
        <div id="subtab-ha" class="sub-tab-content active" role="tabpanel" aria-labelledby="ha">
          <div id="ha-devices-container"></div>
          <button type="button" id="add-ha-device" class="fetch-btn">+ Add HA Device</button>
        </div>

        <div id="subtab-mqtt" class="sub-tab-content" role="tabpanel" aria-labelledby="mqtt">
          <div id="mqtt-devices-container"></div>
          <button type="button" id="add-mqtt-device" class="fetch-btn">+ Add MQTT Broker</button>
        </div>

        <div id="subtab-modbus" class="sub-tab-content" role="tabpanel" aria-labelledby="modbus">
          <div id="modbus-devices-container"></div>
          <button type="button" id="add-modbus-device" class="fetch-btn">+ Add Modbus Device</button>
        </div>

        <div id="subtab-external" class="sub-tab-content" role="tabpanel" aria-labelledby="external">
          <div id="external-sources-container"></div>
          <button type="button" id="add-external-source" class="fetch-btn">+ Add External Source</button>
          <div class="form-group" style="margin-top:1rem;">
            <label for="external-poll-interval">Global Poll Interval (seconds)</label>
            <input id="external-poll-interval" name="external_poll_interval" value="60">
          </div>
        </div>

        <div id="subtab-bms" class="sub-tab-content" role="tabpanel" aria-labelledby="bms">
          <div id="bms-devices-container"></div>
          <button type="button" id="add-bms-device" class="fetch-btn">+ Add BMS Device</button>
          <div class="note">Requires the BMS bridge container to be running.</div>
        </div>
      </div>

      <!-- Tab 2: Metrics -->
      <div id="tab-metrics" class="tab-content" role="tabpanel" aria-labelledby="metrics">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap: wrap; gap: 0.5rem;">
          <h3 style="margin:0; flex: 1 1 100%;">Metrics Management</h3>
          <button type="button" id="create-metric-btn" class="fetch-btn">+ New Metric</button>
        </div>
        <div id="metrics-table-container">
          <table class="metrics-table">
            <thead>
              <tr>
                <th>Metric Name</th>
                <th>Current Value</th>
                <th>Last Updated</th>
                <th>Unit</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="metrics-table-body">
              <tr><td colspan="5">Loading metrics...</td></tr>
            </tbody>
           </table>
        </div>
      </div>

      <!-- Tab 3: Solar Forecast -->
      <div id="tab-solar" class="tab-content" role="tabpanel" aria-labelledby="solar">
        <div class="toggle-group">
          <label for="forecast-enabled"><input id="forecast-enabled" type="checkbox" name="forecast_enabled"> Enable Solar Forecast</label>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="solar-latitude">Latitude</label><input id="solar-latitude" name="solar_latitude"></div>
          <div class="form-group"><label for="solar-longitude">Longitude</label><input id="solar-longitude" name="solar_longitude"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="solar-tilt">Panel Tilt (°)</label><input id="solar-tilt" name="solar_tilt" value="30"></div>
          <div class="form-group"><label for="solar-azimuth">Panel Azimuth (°)</label><input id="solar-azimuth" name="solar_azimuth" value="180"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="solar-capacity">Capacity (kWp)</label><input id="solar-capacity" name="solar_capacity_kwp"><div class="note">Peak power</div></div>
          <div class="form-group"><label for="solcast-api-key">Solcast API Key</label><input id="solcast-api-key" type="password" name="solcast_api_key" autocomplete="off"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="solcast-resource-id">Solcast Resource ID</label><input id="solcast-resource-id" name="solcast_resource_id"></div>
          <div class="form-group"><label for="solar-loss-factor">Loss Factor</label><input id="solar-loss-factor" name="solar_loss_factor" value="0.9"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="solar-install-date">Installation Date</label><input id="solar-install-date" name="solar_install_date" placeholder="2020-01-01"></div>
        </div>
        <div class="test-row">
          <button type="button" id="test-forecast" class="fetch-btn">Test Forecast</button>
          <span id="forecast-test-status" class="test-status"></span>
        </div>
      </div>

      <!-- Tab 4: Dashboard Layout -->
      <div id="tab-dashboard" class="tab-content" role="tabpanel" aria-labelledby="dashboard">
        <div id="dashboard-editor">
          <div id="dashboards-list"></div>
          <button type="button" id="add-dashboard-btn" class="fetch-btn">+ New Dashboard</button>
          <div id="active-dashboard-editor" style="margin-top:1rem;"></div>
        </div>
        <div class="backup-row" style="margin-top:1rem;">
          <button type="button" id="export-layout-btn" class="fetch-btn" aria-label="Download dashboard layout configuration">📤 Export</button>
          <button type="button" id="import-layout-btn" class="fetch-btn" aria-label="Upload dashboard layout configuration">📥 Import</button>
          <input type="file" id="import-layout-file" accept=".json">
        </div>
      </div>

      <!-- Tab 5: Backup & Restore -->
      <div id="tab-backup" class="tab-content" role="tabpanel" aria-labelledby="backup">
        <div class="backup-row">
          <button type="button" id="backup-btn" class="fetch-btn" aria-label="Download database backup">⬇️ Download</button>
          <button type="button" id="restore-btn" class="fetch-btn" aria-label="Upload and restore from backup">⬆️ Restore</button>
          <input type="file" id="restore-file" accept=".db">
        </div>
        <div id="backup-status" class="status"></div>
      </div>

      <!-- Tab 6: Branding & Savings -->
      <div id="tab-branding" class="tab-content" role="tabpanel" aria-labelledby="branding">
        <h3>Branding</h3>
        <div class="form-group"><label for="dashboard-title">Dashboard Title</label><input id="dashboard-title" name="dashboard_title" value="⚡ Epilykos"></div>
        <div class="form-group"><label for="dashboard-logo">Logo URL</label><input id="dashboard-logo" name="dashboard_logo"></div>
        <h3>Savings Calculation</h3>
        <div class="form-row">
          <div class="form-group"><label for="savings-currency">Currency</label><input id="savings-currency" name="savings_currency" value="€"></div>
          <div class="form-group"><label for="savings-rate">Rate per kWh</label><input id="savings-rate" name="savings_rate" value="0.30"></div>
        </div>
      </div>

      <div style="margin-top:2rem; text-align:center;"><button type="submit">Save All Settings</button></div>
      <div id="save-status" class="status"></div>
    </form>
  </div>
</div>

<!-- Metric creation modal -->
<div id="metric-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-content">
    <h3 id="modal-title">Create New Metric</h3>
    <div class="form-group"><label for="new-metric-name">Metric Name</label><input type="text" id="new-metric-name"></div>
    <div class="form-group"><label for="new-metric-unit">Unit (optional)</label><input type="text" id="new-metric-unit"></div>
    <div style="display:flex; gap:1rem; justify-content:flex-end; flex-wrap: wrap;">
      <button type="button" id="modal-cancel">Cancel</button>
      <button type="button" id="modal-create" class="fetch-btn">Create</button>
    </div>
  </div>
</div>

<script>
  // Theme toggle
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const toggle = document.getElementById('theme-toggle');
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      toggle.innerHTML = '<span class="theme-icon">☀️</span>';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      toggle.innerHTML = '<span class="theme-icon">🌙</span>';
    }
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const n = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
    const toggle = document.getElementById('theme-toggle');
    toggle.innerHTML = n === 'dark' ? '<span class="theme-icon">☀️</span>' : '<span class="theme-icon">🌙</span>';
  }
  initTheme();
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // Main tab switching
  const mainTabs = document.querySelectorAll('.main-tab-btn');
  const mainContents = document.querySelectorAll('.tab-content');
  function switchMainTab(tabId) {
    mainTabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    const activeTab = document.querySelector(`.main-tab-btn[data-tab="${tabId}"]`);
    if (activeTab) { activeTab.classList.add('active'); activeTab.setAttribute('aria-selected', 'true'); activeTab.focus(); }
    mainContents.forEach(c => c.classList.remove('active'));
    const activeContent = document.getElementById(`tab-${tabId}`);
    if (activeContent) activeContent.classList.add('active');
  }
  mainTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const tabId = tab.getAttribute('data-tab');
      switchMainTab(tabId);
    });
    tab.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const tabsArray = Array.from(mainTabs);
        const currentIndex = tabsArray.indexOf(tab);
        const direction = e.key === 'ArrowLeft' ? -1 : 1;
        const nextIndex = (currentIndex + direction + tabsArray.length) % tabsArray.length;
        const nextTab = tabsArray[nextIndex];
        const nextTabId = nextTab.getAttribute('data-tab');
        switchMainTab(nextTabId);
      }
    });
  });

  // Sub-tab switching (Data Sources)
  const subTabs = document.querySelectorAll('.sub-tab-btn');
  const subContents = document.querySelectorAll('.sub-tab-content');
  function switchSubTab(subId) {
    subTabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    const activeSub = document.querySelector(`.sub-tab-btn[data-subtab="${subId}"]`);
    if (activeSub) { activeSub.classList.add('active'); activeSub.setAttribute('aria-selected', 'true'); activeSub.focus(); }
    subContents.forEach(c => c.classList.remove('active'));
    const activeContent = document.getElementById(`subtab-${subId}`);
    if (activeContent) activeContent.classList.add('active');
  }
  subTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const subId = tab.getAttribute('data-subtab');
      switchSubTab(subId);
    });
    tab.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const tabsArray = Array.from(subTabs);
        const currentIndex = tabsArray.indexOf(tab);
        const direction = e.key === 'ArrowLeft' ? -1 : 1;
        const nextIndex = (currentIndex + direction + tabsArray.length) % tabsArray.length;
        const nextTab = tabsArray[nextIndex];
        const nextSubId = nextTab.getAttribute('data-subtab');
        switchSubTab(nextSubId);
      }
    });
  });
</script>
<script src="settings.js"></script>
</body>
